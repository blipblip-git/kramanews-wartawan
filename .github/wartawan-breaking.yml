name: AI Wartawan KramaNews - Breaking

# ══════════════════════════════════════════════════════
#  WARTAWAN-BREAKING.YML — V1.0
#  KHUSUS BREAKING — 1x/jam, 24 jam penuh
#  Tidak cek kategori, tidak cek pasar modal.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ V1.0: 1x/JAM, 24 JAM (menit :07) ═══
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan cek breaking
        run: python3 skrip-wartawan.py --sekali --breaking
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}