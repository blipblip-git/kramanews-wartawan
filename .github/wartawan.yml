name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.12
#  Perubahan dari V6.11:
#   - Pasar modal digeser: 12:00 → 14:00 WITA (Tengah) & 18:00 (Penutupan)
#   - Cron pasar modal: '0 4,10 * * *' → '0 6,10 * * *'
#   - Tidak ada perubahan lain (kategori tetap 06:07–19:37 WITA, 2x/jam)
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ V6.11: JAM SIBUK (06:07-19:37 WITA) — 2x/jam, menit :07 & :37 ═══
    # 06:07 WITA = 22:07 UTC (hari sebelumnya)
    - cron: '7,37 22 * * *'      # 06:07, 06:37 WITA
    # 07:07-19:37 WITA = 23:07 (hari sebelumnya) - 11:37 UTC
    - cron: '7,37 23 * * *'      # 07:07, 07:37 WITA
    - cron: '7,37 0-11 * * *'    # 08:07-19:37 WITA (2x/jam, 12 jam)
    # ═══ V6.12: PASAR MODAL 14:00 & 18:00 WITA = 06:00 & 10:00 UTC ═══
    - cron: '0 6,10 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu kategori
        run: python3 skrip-wartawan.py --sekali --kategori
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}