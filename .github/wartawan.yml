name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.13
#  Perubahan dari V6.12:
#   - Hapus semua cron GitHub (tidak reliable, delay 1-2 jam)
#   - Pemicu pindah ke cron-job.org via workflow_dispatch
#   - Isi jobs tetap sama (kategori + pasar modal)
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
# ══════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu kategori
        run: python3 skrip-wartawan.py --sekali --kategori
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}