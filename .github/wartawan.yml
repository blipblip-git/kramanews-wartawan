name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.9
#  Perubahan dari V6.8:
#   + Tambah FOOTBALL_API_KEY di env (untuk klasmen M/D/K/P
#     dari api-sports.io). Tanpa ini, klasmen fallback ke ESPN.
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ RAMAI (07:00-21:59 WITA): 4x/jam — menit 7/22/37/52 ═══
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ PASAR MODAL 12:00 & 18:00 WITA = 04:00 & 10:00 UTC ═══
    - cron: '0 4,10 * * *'
    # ═══ JAM TENANG (22:00-06:59 WITA): tiap 120 MENIT ═══
    - cron: '7 14,16,18,20,22 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
