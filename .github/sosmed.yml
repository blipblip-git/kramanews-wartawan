name: KramaNews Sosmed Auto-Post

# ══════════════════════════════════════════════════════
#  SOSMED.YML — V1.4
#  Perubahan dari V1.3:
#   - Hapus cron GitHub (tidak reliable)
#   - Pemicu pindah ke cron-job.org via workflow_dispatch
#   - Isi jobs tetap sama (5 siklus: 06:17, 09:17, 12:17, 15:17, 18:17 WITA)
# ══════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}