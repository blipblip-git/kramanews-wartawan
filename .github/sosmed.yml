name: KramaNews Sosmed Auto-Post

on:
  schedule:
    # ═══ KALIBRASI WITA (UTC+8) — waktu Tarakan ═══
    # V1.1: menit digeser dari 0/20/30/40 ke 7/22/37/52
    # (menit 00 paling padat di GitHub Actions → sering telat/dilewati)
    # ═══ TIAP 15 MENIT — JAM SIBUK (09:00-21:59 WITA = 01-13 UTC) ═══
    - cron: '7,22,37,52 1-13 * * *'
    # ═══ TIAP 30 MENIT — JAM TENANG (22:00-08:59 WITA) ═══
    # 14-15 UTC = 22-23 WITA | 16-23 UTC = 00-07 WITA | 0 UTC = 08 WITA
    - cron: '7,37 14-15 * * *'
    - cron: '7,37 16-23 * * *'
    - cron: '7,37 0 * * *'
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}