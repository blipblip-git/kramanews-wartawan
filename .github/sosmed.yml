name: KramaNews Sosmed Auto-Post

on:
  schedule:
    # ═══ V1.3: menit digeser ke :17 (kurang padat di GitHub Actions) ═══
    # Jam WITA: 06:17, 09:17, 12:17, 15:17, 18:17
    # Jam UTC (WITA-8): 22:17, 01:17, 04:17, 07:17, 10:17
    - cron: '17 22 * * *'   # 06:17 WITA
    - cron: '17 1 * * *'    # 09:17 WITA
    - cron: '17 4 * * *'    # 12:17 WITA
    - cron: '17 7 * * *'    # 15:17 WITA
    - cron: '17 10 * * *'   # 18:17 WITA
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}