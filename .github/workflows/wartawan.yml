name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.7 (KRAMAV67MARKER)
#  Perubahan dari V6.6:
#   + CRON BARU 02:30 UTC = 10:30 WITA → sesi PASAR MODAL
#     (multi-materi dirangkum 1 berita; Yahoo sudah di-KICK)
#   + JAM TENANG dirapatkan hemat: 60 → 120 menit
#     (keputusan pemilik: target biaya AI ≤ $0.08/hari)
#   Jadwal ramai (07-21 WITA) tidak berubah; NBA pindah ke 13
#   di sisi skrip (bukan cron — cron tetap menit 7/22/37/52).
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ RAMAI (07:00-21:59 WITA): 4x/jam — menit 7/22/37/52 ═══
    # 23 UTC + 0-13 UTC
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ PASAR MODAL 10:30 WITA = 02:30 UTC ═══
    - cron: '30 2 * * *'
    # ═══ JAM TENANG (22:00-06:59 WITA): tiap 120 MENIT (V6.7 hemat)
    # 14 UTC = 22:00 WITA → 16 UTC = 00:00 → 18 UTC = 02:00
    # → 20 UTC = 04:00 → 22 UTC = 06:00 (terakhir jam tenang)
    - cron: '7 14,16,18,20,22 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
