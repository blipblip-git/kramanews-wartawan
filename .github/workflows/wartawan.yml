name: AI Wartawan KramaNews

on:
  schedule:
    # ═══ MENIT 7 & 37 — SENGAJA TIDAK PAS MENIT 0/30 ═══
    # Menit 0 & 30 = puncak kepadatan GitHub global → run sering
    # tertunda lama atau dibuang (rekomendasi resmi GitHub:
    # hindari awal jam). Menit sepi = run jauh lebih andal.
    # 22-23 UTC = 05:00-06:59 WIB — tiap 30 menit
    - cron: '7,37 22-23 * * *'
    # 0-13 UTC = 07:00-20:59 WIB — tiap 30 menit (semua jam kuota kategori 06-20)
    - cron: '7,37 0-13 * * *'
    # 14-21 UTC = 21:00-04:59 WIB — tiap 60 menit (jam tenang, hemat menit)
    - cron: '7 14-21 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
