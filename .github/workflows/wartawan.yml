name: AI Wartawan KramaNews

# V6.4.2-KAWAL (19 Sep 2026): cron ganda + JAM MULAI 07:00 WITA.
# Jendela 05:00-06:59 WITA DIHAPUS (keputusan pemilik: tidak ada lagi
# berita jam 5-6 pagi). Run pertama tiap hari = 07:07 WITA — pas dengan
# jendela RANGKUMAN LIGA EROPA yang kini berjalan jam 07:00.
# Kalau satu run dibuang GitHub (antrean global padat), kawal
# menit 22/52 menyelamatkan. Run dobel AMAN (anti-dobel menolak, biaya nol).
on:
  schedule:
    # ═══ SEMUA CRON DALAM UTC — DIKALIBRASI KE WITA (UTC+8) ═══
    # 23 UTC + 0-13 UTC = 07:00-21:59 WITA (jam ramai: 4x/jam + kawal)
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ JAM TENANG (22:00-06:59 WITA): tiap 60 menit + kawal ═══
    # 14-20 UTC = 22:00-06:59 WITA
    - cron: '7,52 14-20 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
