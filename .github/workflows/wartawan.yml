name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.6 (KRAMAV66MARKER)
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
#  Semua kunci tinggal di Settings → Secrets → Actions.
#  File ini hanya MEMANGGIL nama lacinya: ${{ secrets.NAMA }}
#  Perubahan dari V6.5.2:
#   + ADMIN_OPS_SECRET disuntikkan ke env skrip-wartawan.py
#     (skrip V6.6 wajib bawa kunci melewati gerbang admin-ops V2)
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ SEMUA CRON DALAM UTC — DIKALIBRASI KE WITA (UTC+8) ═══
    # 23 UTC + 0-13 UTC = 07:00-21:59 WITA (jam ramai: 4x/jam + kawal)
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ JAM TENANG (22:00-06:59 WITA): tiap 60 menit + kawal ═══
    # 14-20 UTC = 22:00-06:59 WITA
    - cron: '7,52 14-20 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
