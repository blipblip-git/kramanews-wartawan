name: AI Wartawan KramaNews

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 WIB
    - cron: '0 3 * * *'    # 10:00 WIB
    - cron: '0 7 * * *'    # 14:00 WIB
    - cron: '0 9 * * *'    # 16:00 WIB
    - cron: '0 12 * * *'   # 19:00 WIB
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
