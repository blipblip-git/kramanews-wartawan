name: AI Wartawan KramaNews

# V6.4-KAWAL (17 Sep 2026): cron ganda — setiap slot dijalankan di
# dua menit berbeda (7/37 + 22/52). Kalau satu run dibbuang GitHub
# (antrean global padat — terjadi 17 Sep: 5 jam kosong), kawalnya
# menyelamatkan. Run kedua yang lolos dobel AMAN: anti-dobel 36 jam +
# kuota + IDX/liga anti-ganda membuat run kosong tanpa biaya.
on:
  schedule:
    # ═══ SEMUA CRON DALAM UTC — DIKALIBRASI KE WITA (UTC+8) ═══
    # ═══ JAM RAMAI: tiap 30 menit + KAWAL di menit 22/52 ═══
    # 21-22 UTC = 05:00-06:59 WITA
    - cron: '7,22,37,52 21-22 * * *'
    # 23 UTC + 0-13 UTC = 07:00-21:59 WITA
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ JAM TENANG (21:00-04:59 WITA): tiap 60 menit + kawal ═══
    # 14-20 UTC = 22:00-04:59 WITA
    - cron: '7,52 14-20 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
