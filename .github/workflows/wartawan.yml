name: AI Wartawan KramaNews

on:
  schedule:
    # ═══ SEMUA CRON DALAM UTC — DIKALIBRASI KE WITA (UTC+8) ═══
    # Kuota kategori berjalan pada jam 06:00-20:00 WITA (waktu Tarakan).
    # WITA 06:00 = UTC 22:00 (hari sebelumnya)
    # ═══ JAM RAMAI (05:00-21:59 WITA): tiap 30 MENIT ═══
    # 21-22 UTC = 05:00-06:59 WITA (mencakup kuota jam 06:00 WITA)
    - cron: '7,37 21-22 * * *'
    # 23 UTC + 0-13 UTC = 07:00-21:59 WITA (mencakup semua kuota 07-20 WITA)
    - cron: '7,37 23 * * *'
    - cron: '7,37 0-13 * * *'
    # ═══ JAM TENANG (21:00-04:59 WITA): tiap 60 MENIT — hemat menit ═══
    # 14-20 UTC = 22:00-04:59 WITA
    - cron: '7 14-20 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
