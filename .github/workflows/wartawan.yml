name: AI Wartawan KramaNews

# ══════════════════════════════════════════════════════
#  WARTAWAN.YML — V6.6 (KRAMAV66MARKER)
#  Perubahan dari V6.5.2:
#   + ADMIN_OPS_SECRET disuntikkan ke env skrip-wartawan.py.
#     Skrip V6.6 WAJIB membawa kunci ini untuk melewati gerbang
#     admin-ops V2 (x-admin-secret) — tanpa kunci = skrip berhenti
#     dengan pesan jelas (tidak lagi gagal 401 diam-diam).
#  Warisan V6.5.2: step cek_versi.py — penjaga versi & struktur
#  file otomatis (SENTINEL VERSI dibaca tiap run, hasil di baris
#  awal log). Jadwal tidak berubah.
# ══════════════════════════════════════════════════════

on:
  schedule:
    # ═══ SEMUA CRON DALAM UTC — DIKALIBRASI KE WITA (UTC+8) ═══
    # 23 UTC + 0-13 UTC = 07:00-21:59 WITA (jam ramai: 4x/jam + kawal)
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-13 * * *'
    # ═══ JAM TENANG (22:00-06:59 WITA): tiap 60 menit + kawal ═══
    # 14-20 UTC = 22:00-06:59 WITA
    - cron: '7,52 14-20 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          
          DEEPSEEK_KEY: ${{ sk-fac9341a34884927b8fb9be9f086e4e1 }}
          SUPABASE_PUBLISHABLE: ${{sb_publishable_Lp3ygH-WKXafc-sfB_fBIg_EduwjaZw }}
          PEXELS_API_KEY: ${{ 4qLvZmyIfgF2hcZGlAGMc6Wvblk9m4hubr5tcAthYOoadbnLpC8MqbUS }}
          ADMIN_OPS_SECRET: ${{321ae9077ab3ea07aa2ac70c59a48b001d3ae75c4d2e79cff1cfc1ee5ba6d8fe }}
