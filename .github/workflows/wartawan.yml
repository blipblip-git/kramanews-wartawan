name: AI Wartawan KramaNews

on:
  schedule:
    # ═══ JAM RAMAI (05:00-21:59 WIB): tiap 30 MENIT ═══
    # 22-23 UTC = 05:00-06:59 WIB
    - cron: '0,30 22-23 * * *'
    # 0-13 UTC = 07:00-20:59 WIB (mencakup semua jam kuota kategori 06-20 WIB)
    - cron: '0,30 0-13 * * *'
    # ═══ JAM TENANG (21:00-04:59 WIB): tiap 60 MENIT — hemat menit Actions ═══
    # 14-21 UTC = 21:00-04:59 WIB
    - cron: '0 14-21 * * *'
  workflow_dispatch:

jobs:
  berburu:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install requests feedparser

      - name: Wartawan berburu berita
        run: python3 skrip-wartawan.py --sekali
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
