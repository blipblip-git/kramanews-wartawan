name: AI Wartawan KramaNews - Breaking

# ══════════════════════════════════════════════════════
#  BREAKING.YML — V1.4
#  Perubahan dari V1.3:
#   - Tambah install Chromium (Playtrafi/patchright)
#  ATURAN EMAS: FILE INI TIDAK PERNAH BERISI KUNCI ASLI.
# ══════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install library
        run: pip install -r requirements.txt

      - name: Install Chromium (Playtrafi)
        run: patchright install chromium

      - name: Cek versi & struktur file
        run: python cek_versi.py

      - name: Wartawan berburu breaking
        run: python3 skrip-wartawan.py --sekali --breaking
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ADMIN_OPS_SECRET: ${{ secrets.ADMIN_OPS_SECRET }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}