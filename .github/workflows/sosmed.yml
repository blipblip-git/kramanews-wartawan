name: KramaNews Sosmed Auto-Post

# ══════════════════════════════════════════════════════
#  SOSMED.YML — V1.6
#  Perubahan dari V1.5:
#   - Hapus install Pillow (tidak dipakai lagi di V1.13)
#   - FB kirim gambar asli (tanpa tempel judul)
# ══════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}