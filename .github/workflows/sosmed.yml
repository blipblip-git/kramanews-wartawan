# ══════════════════════════════════════════════════════
#  SOSMED.YML — V1.7
#  Perubahan dari V1.6:
#   - Tambah install Pillow (untuk render overlay gambar)
#   - Tambah install fonts-dejavu-core (font untuk Pillow)
# ══════════════════════════════════════════════════════

name: KramaNews Sosmed Auto-Post

on:
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install requests Pillow
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}