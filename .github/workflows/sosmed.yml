name: KramaNews Sosmed Auto-Post

on:
  schedule:
    # Setiap 20 MENIT (03:00–14:59 UTC = 10:00–21:59 WIB)
    - cron: '*/20 3-14 * * *'
    # Setiap 40 menit di jam tenang (15:00–02:59 UTC = 22:00–09:59 WIB)
    - cron: '0,40 15-23 * * *'
    - cron: '0,40 0-2 * * *'
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
