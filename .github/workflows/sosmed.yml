name: KramaNews Sosmed Auto-Post

on:
  schedule:
    # ═══ V1.2: 5x/hari, tiap 3 jam ═══
    # Jam WITA: 06:00, 09:00, 12:00, 15:00, 18:00
    # Jam UTC (WITA-8): 22:00, 01:00, 04:00, 07:00, 10:00
    # Menit digeser ke 7 (menit 0 paling padat di GitHub Actions)
    - cron: '7 22 * * *'   # 06:07 WITA
    - cron: '7 1 * * *'    # 09:07 WITA
    - cron: '7 4 * * *'    # 12:07 WITA
    - cron: '7 7 * * *'    # 15:07 WITA
    - cron: '7 10 * * *'   # 18:07 WITA
  workflow_dispatch:

jobs:
  posting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 skrip-sosmed.py
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
